version: '3.8'

# Production Docker Compose configuration
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  sentinel-agent:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/attack_records.json') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
