# ============================================================================
# Sentinel Agent v2.2 - Docker Compose Configuration
# ============================================================================
# Complete automated setup for Sentinel Agent
# 
# QUICK START (with host Ollama):
#   1. Ensure Ollama is running: ollama serve
#   2. docker-compose up -d
#
# To use Docker Ollama instead:
#   - Uncomment ollama and ollama-pull services below
#   - Run: docker-compose --profile with-ollama up -d
#
# Production setup:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# View logs:
#   docker-compose logs -f sentinel-agent
#
# Stop everything:
#   docker-compose down
#
# Clean up (remove volumes/data):
#   docker-compose down -v
# ============================================================================

version: '3.9'

services:
  # ========================================================================
  # OLLAMA - LLM Server (AI Engine)
  # ========================================================================
  # NOTE: Using host Ollama (already installed on Ubuntu)
  # If you want to use Ollama in Docker instead, uncomment this service:
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: sentinel-ollama
  #   restart: unless-stopped
  #   profiles:
  #     - with-ollama
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s
  #   networks:
  #     - sentinel-network
  #
  # ========================================================================
  # MODEL PULLER - Download LLM Model
  # ========================================================================
  # NOTE: Only use if running Ollama in Docker (uncomment above)
  #
  # ollama-pull:
  #   image: ollama/ollama:latest
  #   container_name: sentinel-ollama-pull
  #   profiles:
  #     - with-ollama
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #
  # ========================================================================
  # SENTINEL AGENT - Main Security Monitoring System
  # ========================================================================
  sentinel-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.10"
    image: sentinel-agent:2.2
    container_name: sentinel-agent
    
    # Security & Networking
    user: root  # Required for iptables and log monitoring
    privileged: true  # Required for firewall control
    network_mode: host  # Access to all host network interfaces
    cap_add:
      - NET_ADMIN  # Network administration
      - SYS_ADMIN  # System administration
    
    restart: unless-stopped  # Auto-restart if crashes
    
    # Environment variables
    environment:
      # Ollama Configuration (using host Ollama on localhost)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      
      # System Configuration
      AUTH_LOG_PATH: ${AUTH_LOG_PATH:-/var/log/auth.log}
      WEB_LOG_PATH: ${WEB_LOG_PATH:-/var/log/apache2/access.log}
      SENTINEL_LOG_DIR: /app/logs
      SENTINEL_DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # API Configuration
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
      
      # Python Configuration
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
    
    # NOTE: NO PORT MAPPINGS - Using network_mode: host
    # Ports are directly accessible: 8000 (API), 8501 (Dashboard)
    
    # Volume mounts
    volumes:
      # Read-only access to system logs
      - /var/log:/var/log:ro
      # Application data persistence
      - ./data:/app/data
      - ./logs:/app/logs
      # System access for log monitoring
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    
    # Startup configuration
    entrypoint: /usr/local/bin/docker-entrypoint.sh
    command: /usr/local/bin/docker-startup.sh
    
    # NOTE: Using host Ollama (already installed on Ubuntu)
    # Removed 'depends_on' and 'networks' since network_mode:host is used
    # The container can access localhost:11434 for Ollama
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=sentinel-agent"

  # ========================================================================
  # REST API - FastAPI Server (Optional: Separate Service)
  # ========================================================================
  # Uncomment to run REST API as separate container
  # sentinel-api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: sentinel-agent:2.2
  #   container_name: sentinel-api
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  #     PYTHONUNBUFFERED: "1"
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #   command: python sentinel_api.py
  #   depends_on:
  #     - sentinel-agent
  #   networks:
  #     - sentinel-network

  # ========================================================================
  # WEB DASHBOARD - Streamlit UI (Optional: Separate Service)
  # ========================================================================
  # Uncomment to run Streamlit dashboard as separate container
  # sentinel-dashboard:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: sentinel-agent:2.2
  #   container_name: sentinel-dashboard
  #   restart: unless-stopped
  #   environment:
  #     PYTHONUNBUFFERED: "1"
  #   ports:
  #     - "8501:8501"
  #   volumes:
  #     - ./data:/app/data:ro
  #     - ./logs:/app/logs:ro
  #   command: streamlit run dashboard/web_dashboard.py
  #   depends_on:
  #     - sentinel-agent

# ============================================================================
# VOLUMES - Persistent data storage
# ============================================================================
volumes:
  ollama_data:
