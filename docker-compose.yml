# Sentinel Agent - Docker Compose
# 
# Smart Ollama Detection:
# - If Ollama is running on host (port 11434), uses that
# - If not, starts Ollama in Docker automatically
#
# Usage: ./start.sh (recommended) or docker compose up -d

services:
  # Ollama LLM Server (only starts if host Ollama is not available)
  # The sentinel-agent entrypoint checks for host Ollama first
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - with-ollama
    # For GPU support, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Model Puller - Downloads LLM model (only with ollama profile)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    profiles:
      - with-ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling LLM model: $${OLLAMA_MODEL:-llama3:8b}..."
        OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_MODEL:-llama3:8b}
        echo "Model pull complete!"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # Sentinel Agent - Security Monitoring
  sentinel-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-agent
    user: root
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - AUTH_LOG_PATH=${AUTH_LOG_PATH:-/var/log/auth.log}
      - WEB_LOG_PATH=${WEB_LOG_PATH:-/var/log/apache2/access.log}
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/log:/var/log:ro
      - ./data:/app/data
      - ./logs:/app/logs
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: >
      python main.py
      --auth-log ${AUTH_LOG_PATH:-/var/log/auth.log}
      --web-log ${WEB_LOG_PATH:-/var/log/apache2/access.log}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/attack_records.json') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Internal-only Zero-Exposure Admin Dashboard (do NOT publish ports)
  # Start with: docker compose up -d --profile dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    restart: unless-stopped
    network_mode: none   # isolates the dashboard from external networks
    environment:
      - DASHBOARD_USER=${DASHBOARD_USER:-sentinel}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-sentinel}
      - DASHBOARD_WS_TOKEN_TTL=${DASHBOARD_WS_TOKEN_TTL:-300}
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      uvicorn dashboard.app:app --host 127.0.0.1 --port 8080 --log-level info
    profiles:
      - dashboard
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  ollama_data:
